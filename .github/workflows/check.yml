name: Check ContentOps
on: [push, pull_request]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: contentops_test
          POSTGRES_PASSWORD: contentops_test
          POSTGRES_DB: contentops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U contentops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTENTOPS_TEST_DATABASE_URL: postgresql://contentops_test:contentops_test@localhost:5432/contentops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest
      - name: Build deployment image
        run: docker build -t contentops-backend:ci .
