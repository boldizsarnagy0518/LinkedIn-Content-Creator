[project]
name = "contentops-api"
version = "1.0.0"
description = "Python workflow, persistence, and MCP backend for ContentOps"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "httpx>=0.28.0,<1.0",
  "mcp>=2.0.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "pydantic>=2.10.4,<3.0",
  "pydantic-settings>=2.7.0,<3.0",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9.0",
  "ruff>=0.12.0,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
